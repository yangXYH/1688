<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>采货台 · Chrome 自动问答</title><link rel="stylesheet" href="panel.css"><script src="panel.js" defer></script></head>
<body><header><strong>采货台 · 可见自动问答</strong><span id="connection">未连接本机服务</span></header><main>
  <p class="intro">在你已登录的 Chrome 中操作。每家供应商保留真实旺旺标签页，你可直接回复；触碰会话页面或开始打字会接管该家。</p>
  <div id="message" role="status"></div>
  <details open id="connection-box"><summary>1. 连接本机服务</summary><form id="connect"><label>服务端口<input id="port" type="number" value="4173" min="1" max="65535"></label><label>当前 Chrome 旺旺买家账号<input id="login" placeholder="留空使用本机采购账号，请核对页面顶部名称" maxlength="100" autocomplete="off"></label><button type="submit">连接插件</button></form><p>保持此侧栏开启。关闭侧栏、掉线或出现验证时，程序会暂停。</p></details>
  <section><h2>2. 在 1688 搜索</h2><label>商品关键词<input id="keyword" maxlength="100" placeholder="例如：行李箱20寸"></label><div class="row"><label>本批商品数<input id="count" type="number" value="5" min="1" max="100"></label><button id="search" type="button">打开搜索</button><button id="read-search" type="button">读取当前搜索页</button></div><div id="offers"></div></section>
  <section><h2>3. 授权本批问答</h2><label class="check"><input id="cert" type="checkbox" checked>询问资质和提前提供报告</label><label class="check"><input id="clarify" type="checkbox" checked>每项最多自动追问一次</label><details><summary>查看固定问题和必要时的澄清话术</summary><ol id="questions"></ol></details><label>本次最多发送消息数<input id="budget" type="number" min="1" max="1000" value="100"></label><label class="check"><input id="consent" type="checkbox">我已核对本批对象和话术，授权发送商品链接、这些问题及已勾选的固定追问，不作采购承诺。</label><div class="row"><button id="start" type="button" disabled>开始本批自动问答</button><button id="pause" type="button">暂停全部</button><button id="resume" type="button">恢复当前批次</button></div></section>
  <section><h2>真实会话进度</h2><p id="status">还没有启动任务</p><div id="jobs"></div></section>
  <details><summary>模型连接设置</summary><form id="model-form"><label>完整 Chat Completions URL<input id="endpoint" type="url" placeholder="https://服务地址/chat/completions"></label><label>模型名称<input id="model" maxlength="150"></label><label>API Key<input id="api-key" type="password" autocomplete="off" placeholder="留空保留同地址已有密钥"></label><label>模型并发数<input id="workers" type="number" min="1" max="8" value="8"></label><button type="submit">保存模型设置</button></form><p>对话内容会交给你配置的模型。密钥保留在本机服务内存，不写入插件包。</p></details>
</main></body></html>
